name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify dependency tree
        run: npm ls --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Type-check and build
        env:
          # Prerendered shared pages initialize the Supabase client during the build.
          # These public placeholders are used only by this CI step.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
        run: npm run verify

  backend:
    name: .NET unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore src/backend/Tokin.CarService.slnx

      - name: Run backend tests
        run: dotnet test src/backend/Tokin.CarService.slnx --no-restore --configuration Release
